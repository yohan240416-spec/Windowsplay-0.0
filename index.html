<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windowsplay 0.0</title>
<style>
body{margin:0;background:#008080;font-family:Tahoma;overflow:hidden}
#desktop{width:100vw;height:100vh;position:relative}
.icon{width:80px;text-align:center;color:white;font-size:12px;margin:10px;cursor:pointer}
.icon img{width:48px;height:48px}
#taskbar{position:absolute;bottom:0;width:100%;height:35px;background:#c0c0c0;border-top:2px solid white;display:flex;align-items:center}
#start{background:#c0c0c0;border:2px outset white;padding:3px 10px;font-weight:bold;cursor:pointer;margin-left:5px}
#window{position:absolute;top:20%;left:20%;width:600px;height:400px;background:#c0c0c0;border:2px outset white;display:none;flex-direction:column}
#title{ background:#000080;color:white;padding:3px;display:flex;justify-content:space-between}
#content{flex:1;background:white;color:black;padding:10px;overflow:auto}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" onclick="openWin('Meu Computador')">
    <img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-5.png"><br>Meu Computador
  </div>
  <div class="icon" onclick="openWin('Windowsplay Emulator')">
    <img src="https://win98icons.alexmeub.com/icons/png/ms_dos-2.png"><br>Windowsplay
  </div>

  <div id="window">
    <div id="title"><span id="wtitle">Janela</span><span onclick="closeWin()" style="cursor:pointer;background:#c0c0c0;color:black;border:1px outset white;padding:0 5px">X</span></div>
    <div id="content">Bem-vindo ao Windowsplay 0.0!<br><br>Este é seu emulador rodando no navegador.<br>Agora seu site já funciona!</div>
  </div>

  <div id="taskbar"><div id="start" onclick="alert('Windowsplay 0.0 - Criado por você!')">Iniciar</div></div>
</div>
<script>
function openWin(t){document.getElementById('wtitle').innerText=t;document.getElementById('window').style.display='flex'}
function closeWin(){document.getElementById('window').style.display='none'}
</script>
</body>
</html>
