<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windowsplay 0.0 - PC Emulator.EXE</title>
<style>
 body{margin:0;background:#000;color:white;font-family:Tahoma;text-align:center}
 #bar{background:#c0c0c0;color:black;padding:8px;display:flex;gap:10px;align-items:center}
 #bar button{padding:6px 12px;border:2px outset white;background:#c0c0c0;font-weight:bold;cursor:pointer}
 #screen{width:800px;height:600px;margin:10px auto;background:#000;display:block}
 #screen div{width:100%;height:100%}
 #screen canvas{width:100%;height:100%}
</style>
</head>
<body>
<div id="bar">
  <b>Windowsplay 0.0</b>
  <input type="file" id="exeInput">
  <button onclick="location.reload()">Reiniciar PC</button>
  <span style="font-size:12px">Selecione um.exe pra rodar</span>
</div>
<div id="screen"></div>

<script src="https://unpkg.com/v86@latest/build/libv86.js"></script>
<script>
let emulator = new V86({
    screen_container: document.getElementById("screen"),
    bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
    vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
    // Sistema base pra rodar.exe - FreeDOS + Windows 98 lite
    // Se quiser mais compatível, depois a gente troca por windows98.img
    hda: { url: "https://copy.sh/v86/images/freedos722.img" },
    autostart: true,
    memory_size: 128 * 1024 * 1024,
    filesystem: {},
    initial_state: { url: "https://copy.sh/v86/images/freedos722-state.bin.zst" }
});

document.getElementById("exeInput").addEventListener("change", async (e)=>{
  let file = e.target.files[0];
  if(!file) return;
  let buf = await file.arrayBuffer();
  let data = new Uint8Array(buf);
  // Grava o.exe dentro do emulador em C:\JOGO.EXE
  await emulator.create_file("/JOGO.EXE", data);
  emulator.keyboard_send_text("C:\\JOGO.EXE\n");
  alert("Arquivo " + file.name + " carregado! Rodando em C:\\JOGO.EXE");
});
</script>
</body>
</html>
